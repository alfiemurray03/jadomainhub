name: Sousa Murray rebrand audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Apply prepared rebrand patch
        if: ${{ hashFiles('.github/rebrand-patch.part*') != '' }}
        shell: bash
        run: |
          cat .github/rebrand-patch.part* | base64 --decode | gzip --decompress > /tmp/rebrand.patch
          patch --strip=1 < /tmp/rebrand.patch
          rm .github/rebrand-patch.part*
          rm -f public/assets/ja-domain-hub-logo.svg public/favicon.ico public/favicon.png public/icon-192.png public/icon-512.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply Sousa Murray Domains website rebrand"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
      - name: Locate legacy public brand references
        shell: bash
        run: |
          echo "=== LEGACY BRAND REFERENCES ==="
          grep -RInE \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=dist \
            --exclude='package-lock.json' \
            --exclude='sousa-murray-rebrand-audit.yml' \
            'JA Domain Hub|Profile Centre|Planyx|Aptenvo|https://jadomainhub\.jagroupservices\.co\.uk|jadomainhub@jagroupservices\.co\.uk' \
            src public index.html package.json || true
          echo "=== END LEGACY BRAND REFERENCES ==="
          echo "=== SOUSA MURRAY SITES STATUS REFERENCES ==="
          grep -RInE \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=dist \
            'Sousa Murray Sites|Managed Website|managed website' \
            src public index.html package.json || true
          echo "=== END SOUSA MURRAY SITES STATUS REFERENCES ==="
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: jadomainhub-source
          path: |
            src
            public
            index.html
            package.json
            tsconfig.json
            vite.config.ts
            tailwind.config.js
          if-no-files-found: error
          retention-days: 1
