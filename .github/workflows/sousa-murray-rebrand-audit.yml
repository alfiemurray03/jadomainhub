name: Sousa Murray rebrand audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate legacy brand references and managed website claims
        shell: bash
        run: |
          echo "=== LEGACY BRAND REFERENCES ==="
          grep -RInE \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=dist \
            --exclude='package-lock.json' \
            --exclude='sousa-murray-rebrand-audit.yml' \
            'JA Domain Hub|jadomainhub\.jagroupservices\.co\.uk|Managed Website|managed website|Website Services|website services' \
            src public index.html README.md package.json || true
          echo "=== END LEGACY BRAND REFERENCES ==="
          echo "=== SOURCE FILES ==="
          find src public -type f -maxdepth 5 | sort
          echo "=== END SOURCE FILES ==="
